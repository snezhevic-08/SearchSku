<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEARCH STORAGE HERON</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --text:#0b1b3f;
  --muted:#64748b;
  --blue:#2563eb;
  --soft-blue:#eff6ff;
  --line:#dbeafe;
  --card:#ffffff;
  --bg1:#eaf4ff;
  --bg2:#f4fff5;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%, rgba(59,130,246,.18), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(34,211,238,.16), transparent 26%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  padding:26px 14px;
  color:var(--text);
}

body.dark{
  --text:#e5e7eb;
  --muted:#94a3b8;
  --card:#111827;
  --line:#1e3a8a;
  --soft-blue:#172554;
  --bg1:#020617;
  --bg2:#0f172a;
  background:
    radial-gradient(circle at 15% 0%, rgba(59,130,246,.20), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(34,211,238,.12), transparent 26%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}

.container{
  max-width:720px;
  margin:auto;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.7);
  border-radius:32px;
  padding:20px;
  box-shadow:0 20px 55px rgba(37,99,235,.12);
  backdrop-filter:blur(18px);
}

body.dark .container{
  background:rgba(15,23,42,.72);
  border:1px solid rgba(148,163,184,.18);
}

.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.logo{
  width:66px;
  height:66px;
  border-radius:22px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  box-shadow:0 15px 25px rgba(37,99,235,.28);
}

.header h1{
  margin:0;
  font-size:25px;
  line-height:1.1;
}

.header p{
  margin:5px 0 0;
  color:var(--muted);
  font-weight:600;
}

.search-box{
  background:var(--card);
  border:1px solid rgba(219,234,254,.95);
  border-radius:28px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 12px 30px rgba(15,23,42,.06);
}

.search-icon{
  width:58px;
  height:58px;
  border-radius:20px;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:30px;
  flex-shrink:0;
}

input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:22px;
  font-weight:600;
  color:var(--text);
}

input::placeholder{
  color:#94a3b8;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:20px;
}

.btn{
  border:0;
  border-radius:24px;
  padding:18px;
  min-height:105px;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  text-align:left;
  box-shadow:0 14px 28px rgba(37,99,235,.18);
  transition:.2s;
}

.btn:active{
  transform:scale(.98);
}

.btn .left{
  display:flex;
  align-items:center;
  gap:13px;
}

.btn .ico{
  width:56px;
  height:56px;
  border-radius:18px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  backdrop-filter:blur(10px);
}

.btn b{
  font-size:24px;
  display:block;
}

.btn small{
  display:block;
  margin-top:5px;
  font-size:14px;
  opacity:.86;
  font-weight:700;
}

.arrow{
  font-size:34px;
  opacity:.75;
}

.dark-btn{
  background:linear-gradient(135deg,#111827,#2563eb);
}

.reset-btn{
  background:linear-gradient(135deg,#14b8a6,#0284c7);
}

.search-btn{
  background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.scan-btn{
  background:linear-gradient(135deg,#10b981,#2563eb);
}

.card{
  margin-top:20px;
  background:var(--card);
  border:1px solid rgba(219,234,254,.9);
  border-radius:28px;
  padding:20px;
  box-shadow:0 12px 30px rgba(15,23,42,.05);
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.card-head h2{
  margin:0;
  font-size:22px;
}

.badge{
  background:#dbeafe;
  color:#1d4ed8;
  padding:10px 15px;
  border-radius:999px;
  font-weight:800;
  font-size:14px;
}

body.dark .badge{
  background:#1e3a8a;
  color:#bfdbfe;
}

.history-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.history-item{
  border:1px solid var(--line);
  background:var(--soft-blue);
  color:#1e3a8a;
  font-weight:800;
  border-radius:999px;
  padding:10px 16px;
  cursor:pointer;
}

body.dark .history-item{
  color:#bfdbfe;
}

.result-box{
  background:linear-gradient(180deg,#f8fbff,#eef6ff);
  border:1px solid var(--line);
  border-radius:26px;
  padding:18px;
}

body.dark .result-box{
  background:linear-gradient(180deg,#0f172a,#111827);
}

.heron-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:17px 20px;
  margin-bottom:14px;
}

.heron-item small{
  display:block;
  color:var(--muted);
  font-size:15px;
  margin-bottom:5px;
}

.heron-item b{
  font-size:26px;
  color:#2563eb;
}

.found{
  text-align:center;
  color:var(--muted);
  font-weight:800;
  margin:14px 0 0;
}

.empty{
  color:var(--muted);
  font-weight:700;
  text-align:center;
  padding:20px 8px;
}

.loading{
  margin-top:16px;
  color:var(--muted);
  font-weight:700;
  text-align:center;
}

#reader{
  display:none;
  margin-top:20px;
  overflow:hidden;
  border-radius:24px;
  border:1px solid var(--line);
}

@media(max-width:560px){
  body{
    padding:18px 10px;
  }

  .container{
    border-radius:28px;
    padding:16px;
  }

  .menu{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .btn{
    padding:13px;
    min-height:100px;
    border-radius:22px;
  }

  .btn .left{
    gap:10px;
  }

  .btn .ico{
    width:48px;
    height:48px;
    font-size:24px;
  }

  .btn b{
    font-size:20px;
  }

  .btn small{
    font-size:13px;
  }

  .arrow{
    font-size:28px;
  }

  input{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🔎</div>
    <div>
      <h1>SEARCH STORAGE HERON</h1>
      <p>Cari kode Heron dari Oddo atau barcode</p>
    </div>
  </div>

  <div class="search-box">
    <div class="search-icon">🔍</div>
    <input id="kode" type="text" placeholder="Masukkan kode Oddo / barcode" autocomplete="off">
  </div>

  <div class="loading" id="statusData">Memuat data...</div>

  <div class="menu">
    <button class="btn dark-btn" onclick="toggleDark()">
      <div class="left">
        <div class="ico">🌙</div>
        <div>
          <b>Dark Mode</b>
          <small>Ubah tema</small>
        </div>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="btn reset-btn" onclick="resetCari()">
      <div class="left">
        <div class="ico">↻</div>
        <div>
          <b>Reset</b>
          <small>Bersihkan hasil</small>
        </div>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="btn search-btn" onclick="cariHeron()">
      <div class="left">
        <div class="ico">🔍</div>
        <div>
          <b>Cari</b>
          <small>Temukan Heron</small>
        </div>
      </div>
      <div class="arrow">›</div>
    </button>

    <button class="btn scan-btn" onclick="mulaiScan()">
      <div class="left">
        <div class="ico">📷</div>
        <div>
          <b>Scan</b>
          <small>Pakai kamera</small>
        </div>
      </div>
      <div class="arrow">›</div>
    </button>
  </div>

  <div id="reader"></div>

  <div class="card">
    <div class="card-head">
      <h2>🕘 Riwayat pencarian</h2>
      <span class="badge" onclick="hapusRiwayat()" style="cursor:pointer;">Hapus</span>
    </div>
    <div class="history-list" id="riwayat"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>📄 Hasil pencarian</h2>
      <span class="badge" id="jumlahHasil">0 kode Heron</span>
    </div>

    <div class="result-box" id="hasil">
      <div class="empty">Masukkan kode lalu tekan Cari.</div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const DATA_SOURCES = [
  {
    nama: "STORAGE G5",
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ/pub?gid=1038187077&single=true&output=csv"
  },
  {
    nama: "BATCH PICKING",
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ/pub?gid=578577194&single=true&output=csv"
  }
];

/*
PENTING:
Kalau link di atas belum jalan, ganti bagian url dengan link CSV publish spreadsheet kamu.

Format link biasanya:
https://docs.google.com/spreadsheets/d/e/KODE_PUBLISH/pub?gid=GID_SHEET&single=true&output=csv
*/

let semuaData = [];
let scannerAktif = false;
let html5QrCode = null;

function clean(teks){
  return String(teks || "")
    .trim()
    .replace(/^'/, "")
    .replace(/\s+/g, "")
    .toUpperCase();
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cell = "";
  let quote = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && quote && next === '"'){
      cell += '"';
      i++;
    }else if(char === '"'){
      quote = !quote;
    }else if(char === "," && !quote){
      row.push(cell);
      cell = "";
    }else if((char === "\n" || char === "\r") && !quote){
      if(cell || row.length){
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
      if(char === "\r" && next === "\n") i++;
    }else{
      cell += char;
    }
  }

  if(cell || row.length){
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

async function loadData(){
  const status = document.getElementById("statusData");
  semuaData = [];

  try{
    for(const sumber of DATA_SOURCES){
      const res = await fetch(sumber.url);
      const text = await res.text();
      const rows = parseCSV(text);

      rows.forEach((row, index) => {
        if(index === 0) return;

        semuaData.push({
          sumber: sumber.nama,
          row: row
        });
      });
    }

    status.textContent = "Data siap digunakan: " + semuaData.length + " baris";
  }catch(error){
    status.textContent = "Gagal memuat data. Periksa link CSV.";
    console.error(error);
  }
}

function cariHeron(){
  const input = document.getElementById("kode");
  const kode = clean(input.value);
  const hasil = document.getElementById("hasil");
  const jumlahHasil = document.getElementById("jumlahHasil");

  if(!kode){
    hasil.innerHTML = `<div class="empty">Masukkan kode Oddo atau barcode dulu.</div>`;
    jumlahHasil.textContent = "0 kode Heron";
    return;
  }

  if(semuaData.length === 0){
    hasil.innerHTML = `<div class="empty">Data masih dimuat...</div>`;
    jumlahHasil.textContent = "0 kode Heron";
    return;
  }

  const hasilFilter = semuaData.filter(item => {
    const row = item.row;

    /*
      MODE SAMA PERSIS
      Tidak pakai includes().
      Jadi 07168 hanya cocok dengan 07168.
      Tidak akan cocok dengan 7168 atau angka yang cuma mirip.
    */

    return (
      clean(row[0]) === kode ||
      clean(row[1]) === kode ||
      clean(row[2]) === kode ||
      clean(row[3]) === kode ||
      clean(row[4]) === kode ||
      clean(row[5]) === kode ||
      clean(row[7]) === kode ||
      clean(row[8]) === kode ||
      clean(row[9]) === kode ||
      clean(row[10]) === kode
    );
  });

  if(hasilFilter.length === 0){
    hasil.innerHTML = `<div class="empty">Kode tidak ditemukan.</div>`;
    jumlahHasil.textContent = "0 kode Heron";
    simpanRiwayat(kode);
    return;
  }

  const kodeHeron = [...new Set(
    hasilFilter
      .map(item => String(item.row[6] || "").trim())
      .filter(Boolean)
  )];

  if(kodeHeron.length === 0){
    hasil.innerHTML = `<div class="empty">Data ditemukan, tapi kolom G / kode Heron kosong.</div>`;
    jumlahHasil.textContent = "0 kode Heron";
    simpanRiwayat(kode);
    return;
  }

  jumlahHasil.textContent = kodeHeron.length + " kode Heron";

  hasil.innerHTML = `
    ${kodeHeron.map((heron, index) => `
      <div class="heron-item">
        <small>Kode Heron ${String(index + 1).padStart(2, "0")}</small>
        <b>${heron}</b>
      </div>
    `).join("")}

    <p class="found">Ditemukan dari ${hasilFilter.length} baris data</p>
  `;

  simpanRiwayat(kode);
}

function resetCari(){
  document.getElementById("kode").value = "";
  document.getElementById("hasil").innerHTML = `<div class="empty">Masukkan kode lalu tekan Cari.</div>`;
  document.getElementById("jumlahHasil").textContent = "0 kode Heron";
}

function toggleDark(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("temaHeron", "dark");
  }else{
    localStorage.setItem("temaHeron", "light");
  }
}

function simpanRiwayat(kode){
  let data = JSON.parse(localStorage.getItem("riwayatHeron") || "[]");

  data = data.filter(item => item !== kode);
  data.unshift(kode);
  data = data.slice(0, 8);

  localStorage.setItem("riwayatHeron", JSON.stringify(data));
  tampilRiwayat();
}

function tampilRiwayat(){
  const box = document.getElementById("riwayat");
  const data = JSON.parse(localStorage.getItem("riwayatHeron") || "[]");

  if(data.length === 0){
    box.innerHTML = `<div class="empty" style="padding:0;text-align:left;">Belum ada riwayat.</div>`;
    return;
  }

  box.innerHTML = data.map(item => `
    <button class="history-item" onclick="pakaiRiwayat('${item}')">⊙ ${item}</button>
  `).join("");
}

function pakaiRiwayat(kode){
  document.getElementById("kode").value = kode;
  cariHeron();
}

function hapusRiwayat(){
  localStorage.removeItem("riwayatHeron");
  tampilRiwayat();
}

async function mulaiScan(){
  const reader = document.getElementById("reader");

  if(scannerAktif){
    await stopScan();
    return;
  }

  reader.style.display = "block";

  html5QrCode = new Html5Qrcode("reader");
  scannerAktif = true;

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },
    async decodedText => {
      document.getElementById("kode").value = decodedText;
      await stopScan();
      cariHeron();
    },
    errorMessage => {}
  ).catch(err => {
    scannerAktif = false;
    reader.style.display = "none";
    alert("Kamera tidak bisa dibuka. Izinkan akses kamera dulu.");
    console.error(err);
  });
}

async function stopScan(){
  const reader = document.getElementById("reader");

  if(html5QrCode){
    try{
      await html5QrCode.stop();
      await html5QrCode.clear();
    }catch(e){}
  }

  scannerAktif = false;
  reader.style.display = "none";
}

document.getElementById("kode").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    cariHeron();
  }
});

if(localStorage.getItem("temaHeron") === "dark"){
  document.body.classList.add("dark");
}

tampilRiwayat();
loadData();
</script>

</body>
</html>
