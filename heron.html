<body>

<div class="app">
  <div class="shell">

    <div class="hero">
      <div class="brand">
        <img src="logo.png" class="logo-image" alt="Search Storage Heron Logo">
        <div>
          <h1>SEARCH STORAGE HERON</h1>
          <p class="sub">Cari kode Heron dari ODDO atau Barcode</p>
        </div>
      </div>

      <div class="hero-art">
        <div class="dots"></div>
        <div class="cube"></div>
        <div class="lens"></div>
      </div>
    </div>

    <div class="search-card">
      <div class="search-icon">🔍</div>
      <input id="kode" placeholder="Masukkan kode ODDO atau Barcode...">
    </div>

    <div class="actions">
      <button id="themeButton" class="action-btn btn-dark" onclick="toggleDark()">
        <span id="themeIcon" class="btn-icon">🌙</span>
        <span class="btn-copy">
          <span id="themeTitle" class="btn-title">Dark Mode</span>
          <span id="themeSub" class="btn-sub">Ubah tema</span>
        </span>
      </button>

      <button class="action-btn btn-reset" onclick="resetCari()">
        <span class="btn-icon">↻</span>
        <span class="btn-copy">
          <span class="btn-title">Reset</span>
          <span class="btn-sub">Bersihkan hasil</span>
        </span>
      </button>

      <button class="action-btn btn-search" onclick="cariHeron()">
        <span class="btn-icon">🔍</span>
        <span class="btn-copy">
          <span class="btn-title">Cari</span>
          <span class="btn-sub">Temukan Heron</span>
        </span>
      </button>

      <button class="action-btn btn-scan" onclick="scanBarcode()">
        <span class="btn-icon">📷</span>
        <span class="btn-copy">
          <span class="btn-title">Scan</span>
          <span class="btn-sub">Pakai kamera</span>
        </span>
      </button>
    </div>

    <div id="history" class="panel" style="display:none;"></div>

    <div id="hasil">
      <div class="panel loading">
        <div class="spinner"></div>
        <div>
          <b>Mengambil data...</b><br>
          Search Storage Heron sedang membaca sheet.
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    🛡️ OddoSearch © 2026 • Built for #JuaraVibeCoding 🚀
  </div>
</div>

<script>
let semuaData = [];
let riwayat = JSON.parse(localStorage.getItem("riwayatHeron")) || [];

const SHEET_ID = "1gcRgVkZLU1zyrsdg7rLrDvhYG7O907QGYKYnY9WW-I0";

const SHEETS = [
  { nama: "STORAGE G5", gid: "1038187077" },
  { nama: "BATCH PICKING", gid: "578577194" }
];

/*
  CLEAN SAMA PERSIS:
  07168 tetap 07168.
  Tidak menghapus angka 0 di depan.
*/
function clean(teks){
  return String(teks || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[^a-z0-9]/g,"");
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && insideQuotes && next === '"'){
      value += '"';
      i++;
    } else if(char === '"'){
      insideQuotes = !insideQuotes;
    } else if(char === "," && !insideQuotes){
      row.push(value);
      value = "";
    } else if((char === "\n" || char === "\r") && !insideQuotes){
      if(value || row.length){
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }

      if(char === "\r" && next === "\n"){
        i++;
      }
    } else {
      value += char;
    }
  }

  if(value || row.length){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function ambilSheet(info){
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${info.gid}`;

  const res = await fetch(url);

  if(!res.ok){
    throw new Error("Gagal membaca " + info.nama);
  }

  const text = await res.text();
  const rows = parseCSV(text);

  return rows.slice(1).map((r,index) => {
    const heron = r[6] || "";

    return {
      sheet: info.nama,
      row: index + 2,
      heron: heron,
      semuaKolom: r,

      /*
        Kolom pencarian sama persis.
        Kolom G / r[6] adalah Kode Heron, jadi tidak dipakai untuk dicari.
        Yang dicari: kolom A-F dan H-K.
      */
      searchKeys: [
        clean(r[0]),
        clean(r[1]),
        clean(r[2]),
        clean(r[3]),
        clean(r[4]),
        clean(r[5]),
        clean(r[7]),
        clean(r[8]),
        clean(r[9]),
        clean(r[10])
      ].filter(Boolean)
    };
  }).filter(item => clean(item.heron));
}

async function loadData(){
  semuaData = [];
  const hasil = document.getElementById("hasil");

  hasil.innerHTML = `
    <div class="panel loading">
      <div class="spinner"></div>
      <div>
        <b>Mengambil data...</b><br>
        Membaca Database.
      </div>
    </div>
  `;

  for(const sheet of SHEETS){
    try{
      const data = await ambilSheet(sheet);
      semuaData.push(...data);
      console.log(`Berhasil baca ${sheet.nama}:`, data.length);
    }catch(e){
      console.log("Gagal membaca:", sheet.nama, e);
    }
  }

  if(semuaData.length === 0){
    hasil.innerHTML = `
      <div class="error">
        Data gagal dimuat atau total data 0.<br><br>
        Cek:<br>
        Pastikan Internet Stabil, Refresh Ulang Halaman
      </div>
    `;
    return;
  }

  tampilStatusSiap();
}

function tampilStatusSiap(){
  const hasil = document.getElementById("hasil");

  hasil.innerHTML = `
    <div class="panel status-card">
      <div class="status-icon">✓</div>
      <div>
        <div class="status-title">Data siap digunakan</div>
        <div class="status-sub">Total data terbaca: <b>${semuaData.length}</b></div>
      </div>
    </div>
  `;
}

function cariHeron(){
  if(semuaData.length === 0){
    alert("Data masih dimuat atau gagal dibaca.");
    return;
  }

  const input = document.getElementById("kode").value;
  const kode = clean(input);
  const hasil = document.getElementById("hasil");

  if(!input.trim()){
    hasil.innerHTML = `<div class="error">Masukkan kode ODDO atau Barcode dulu.</div>`;
    return;
  }

  hasil.innerHTML = `
    <div class="panel loading">
      <div class="spinner"></div>
      <div>
        <b>Mencari kode Heron...</b><br>
        Memproses data warehouse.
      </div>
    </div>
  `;

  setTimeout(() => {
    /*
      MODE SAMA PERSIS:
      Tidak pakai includes().
      Jadi 07168 hanya cocok dengan 07168.
      Tidak cocok dengan 7168, 007168, A07168, atau 07168X.
    */
    const ditemukan = semuaData.filter(item =>
      item.searchKeys.some(key => key === kode)
    );

    if(ditemukan.length === 0){
      hasil.innerHTML = `
        <div class="error">
          Kode Heron tidak ditemukan.<br>
          Coba cek kode ODDO atau Barcode.<br><br>
          Total data terbaca: ${semuaData.length}
        </div>
      `;

      simpanRiwayat(input);
      return;
    }

    simpanRiwayat(input);

    const heronUnik = [];

    ditemukan.forEach(item => {
      const h = String(item.heron || "").trim();

      if(h && !heronUnik.includes(h)){
        heronUnik.push(h);
      }
    });

    hasil.innerHTML = `
      <div class="panel">
        <div class="result-head">
          <div class="result-title">📄 Hasil pencarian</div>
          <span class="badge">${heronUnik.length} kode Heron</span>
        </div>

        <div class="heron-box-result">
          <div class="box-icon">📦</div>

          <div>
            <div class="heron-list">
              ${heronUnik.map((h,index) => `
                <div class="heron-item">
                  <div class="info-label">Kode Heron ${String(index + 1).padStart(2,"0")}</div>
                  <div class="info-value">${escapeHTML(h)}</div>
                </div>
              `).join("")}
            </div>

            <div class="source-text">
              Ditemukan dari ${ditemukan.length} baris data
            </div>
          </div>
        </div>
      </div>
    `;
  }, 300);
}

function escapeHTML(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function resetCari(){
  document.getElementById("kode").value = "";

  if(semuaData.length === 0){
    document.getElementById("hasil").innerHTML = `
      <div class="error">
        Data belum siap atau gagal dimuat.
      </div>
    `;
    return;
  }

  tampilStatusSiap();
}

function toggleDark(){
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");

  localStorage.setItem("heronTheme", isDark ? "dark" : "light");

  updateThemeButton();
}

function updateThemeButton(){
  const isDark = document.body.classList.contains("dark");

  const themeButton = document.getElementById("themeButton");
  const themeIcon = document.getElementById("themeIcon");
  const themeTitle = document.getElementById("themeTitle");
  const themeSub = document.getElementById("themeSub");

  if(isDark){
    themeButton.classList.remove("btn-dark");
    themeButton.classList.add("btn-light");
    themeIcon.textContent = "☀️";
    themeTitle.textContent = "Light Mode";
    themeSub.textContent = "Ubah tema";
  }else{
    themeButton.classList.remove("btn-light");
    themeButton.classList.add("btn-dark");
    themeIcon.textContent = "🌙";
    themeTitle.textContent = "Dark Mode";
    themeSub.textContent = "Ubah tema";
  }
}

function loadTheme(){
  const savedTheme = localStorage.getItem("heronTheme");

  if(savedTheme === "dark"){
    document.body.classList.add("dark");
  }

  updateThemeButton();
}

function simpanRiwayat(kode){
  const nilai = String(kode || "").trim();

  if(!nilai) return;

  riwayat = riwayat.filter(item => item !== nilai);
  riwayat.unshift(nilai);
  riwayat = riwayat.slice(0,5);

  localStorage.setItem("riwayatHeron", JSON.stringify(riwayat));
  tampilRiwayat();
}

function tampilRiwayat(){
  const history = document.getElementById("history");

  if(riwayat.length === 0){
    history.style.display = "none";
    history.innerHTML = "";
    return;
  }

  history.style.display = "block";

  history.innerHTML = `
    <div class="panel-head">
      <div class="panel-title">🕘 Riwayat pencarian</div>
      <div class="see-all" onclick="lihatSemuaRiwayat()">Lihat semua ›</div>
    </div>

    <div class="chips">
      ${riwayat.map(k => `
        <button class="chip" onclick="pakaiRiwayat('${escapeAttr(k)}')">◷ ${escapeHTML(k)}</button>
      `).join("")}
    </div>
  `;
}

function escapeAttr(text){
  return String(text)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll('"',"&quot;");
}

function lihatSemuaRiwayat(){
  if(riwayat.length === 0){
    alert("Belum ada riwayat pencarian");
    return;
  }

  alert("Riwayat pencarian:\n\n" + riwayat.join("\n"));
}

function pakaiRiwayat(kode){
  document.getElementById("kode").value = kode;
  cariHeron();
}

async function scanBarcode(){

  if(!("BarcodeDetector" in window)){
    alert("Browser belum support scan barcode. Coba buka lewat Google Chrome Android.");
    return;
  }

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      }
    });

    const detector = new BarcodeDetector({
      formats: [
        "ean_13",
        "ean_8",
        "code_128",
        "code_39",
        "code_93",
        "qr_code",
        "upc_a",
        "upc_e",
        "itf"
      ]
    });

    const scanBox = document.createElement("div");

    scanBox.innerHTML = `
      <div class="scanner-overlay">
        <video id="scannerVideo" class="scanner-video" autoplay playsinline muted></video>
        <div class="scanner-frame"></div>
        <p class="scanner-text">📷 Arahkan kamera ke barcode barang</p>
        <button id="tutupScanner" class="close-scanner">Tutup Scanner</button>
      </div>
    `;

    document.body.appendChild(scanBox);
    document.body.style.overflow = "hidden";

    const videoElement = scanBox.querySelector("#scannerVideo");
    videoElement.srcObject = stream;
    await videoElement.play();

    function tutupScanner(){
      stream.getTracks().forEach(track => track.stop());
      scanBox.remove();
      document.body.style.overflow = "";
    }

    document.getElementById("tutupScanner").onclick = tutupScanner;

    async function scanLoop(){
      if(!document.body.contains(scanBox)) return;

      try{
        const barcodes = await detector.detect(videoElement);

        if(barcodes.length > 0){
          const kodeBarcode = barcodes[0].rawValue;

          document.getElementById("kode").value = kodeBarcode;

          tutupScanner();
          cariHeron();
          return;
        }
      }catch(err){
        console.log("Scan error:", err);
      }

      requestAnimationFrame(scanLoop);
    }

    scanLoop();

  }catch(err){
    console.log(err);
    document.body.style.overflow = "";
    alert("Kamera tidak bisa dibuka. Izinkan akses kamera dulu.");
  }
}

document.getElementById("kode").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    cariHeron();
  }
});

loadTheme();
tampilRiwayat();
loadData();
</script>
