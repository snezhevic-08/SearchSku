<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Barang Oddo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e8f3ff,#f7fff0);
  padding:22px;
  color:#172033;
}

.box{
  max-width:920px;
  margin:auto;
  background:rgba(255,255,255,.92);
  padding:22px;
  border-radius:24px;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
  border:1px solid rgba(255,255,255,.8);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:16px;
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

h1{
  margin:0;
  font-size:30px;
  letter-spacing:-1px;
}

.sub{
  margin:3px 0 0;
  color:#6b7280;
  font-size:14px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-top:18px;
}

input{
  flex:1;
  padding:16px;
  font-size:18px;
  border-radius:16px;
  border:1px solid #d1d5db;
  outline:none;
  background:#f9fafb;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

button{
  padding:16px 22px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  font-size:16px;
  font-weight:bold;
}

.card{
  background:#eef4ff;
  padding:18px;
  margin-top:16px;
  border-radius:20px;
  line-height:1.8;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}

.total{
  background:linear-gradient(135deg,#dcfce7,#bbf7d0);
  border:1px solid #86efac;
}

.card h3{
  margin-top:0;
}

.error{
  color:#dc2626;
  margin-top:16px;
  font-weight:bold;
}

.section-title{
  margin-top:24px;
  font-size:22px;
}

@media(max-width:600px){
  .search-box{flex-direction:column}
  button{width:100%}
  h1{font-size:28px}
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    <div class="logo-icon">📦</div>
    <div>
      <h1>OddoSearch</h1>
      <p class="sub">Cari barang, stock, batch, koordinat, dan kode Heron</p>
    </div>
  </div>

  <div class="search-box">
    <input id="kode" placeholder="Masukkan kode ODDO...">
    <button onclick="cariBarang()">Cari</button>
  </div>

  <div id="hasil">Mengambil data...</div>

</div>

<script>
const SHEET_ID = "1gcRgVkZLU1zyrsdg7rLrDvhYG7O907QGYKYnY9WW-I0";

const SHEETS = [
  { nama: "KORDINAT PALLET G1", gid: "1990508695" },
  { nama: "KORDINAT PALLET G6", gid: "113664921" },
  { nama: "KORDINAT PALLET G7", gid: "626514614" },
  { nama: "KORDINAT PALLET G8", gid: "876120312" }
];

let semuaData = [];

function clean(teks){
  return String(teks || "")
    .trim()
    .toLowerCase()
    .replace(/\s/g,"")
    .replace(/^0+/,"");
}

function angka(stock){
  return parseFloat(
    String(stock || "0")
      .replace(",",".")
      .replace(/[^0-9.]/g,"")
  ) || 0;
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && insideQuotes && next === '"'){
      value += '"';
      i++;
    } else if(char === '"'){
      insideQuotes = !insideQuotes;
    } else if(char === "," && !insideQuotes){
      row.push(value);
      value = "";
    } else if((char === "\n" || char === "\r") && !insideQuotes){
      if(value || row.length){
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }
      if(char === "\r" && next === "\n") i++;
    } else {
      value += char;
    }
  }

  if(value || row.length){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function ambilSheet(info){
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${info.gid}`;

  const res = await fetch(url);
  const text = await res.text();

  const rows = parseCSV(text);

  let headerIndex = -1;
  let headers = [];

  for(let i = 0; i < rows.length; i++){
    const calon = rows[i].map(h => String(h).trim().toUpperCase());
    if(calon.includes("ODDO")){
      headerIndex = i;
      headers = calon;
      break;
    }
  }

  if(headerIndex === -1){
    console.log("Header ODDO tidak ditemukan:", info.nama);
    return [];
  }

  const idxKoordinat = 7;
  const idxOddo = headers.indexOf("ODDO");
  const idxBarcode = headers.indexOf("BARCODE");
  const idxNama = headers.indexOf("NAMA");
  const idxCode = headers.indexOf("CODE");
  const idxBatch = headers.indexOf("BATCH");
  const idxQty = 20;
  const idxExp = headers.indexOf("EXP DATE");
  const idxHeron = 9;

  return rows.slice(headerIndex + 1).map(r => {
  return {
    sheet: info.nama,
    koordinat: r[idxKoordinat] || "-",
    oddo: r[idxOddo] || "-",
    barcode: r[idxBarcode] || "-",

    nama:
      r[idxNama] ||
      r[idxHeron] ||
      r[idxCode] ||
      "-",
    heron: r[idxHeron] || "-",
    batch: r[idxBatch] || "-",
    stock: r[idxQty] || "0",
    exp: r[idxExp] || "-"
  };
}).filter(item => item.oddo && item.oddo !== "-");
}

  async function loadData(){
  semuaData = [];

  document.getElementById("hasil").innerHTML =
    "Mengambil data...";

  for(const sheet of SHEETS){
    try{
      const data = await ambilSheet(sheet);
      semuaData.push(...data);
    }catch(e){
      console.log("Gagal membaca:", sheet.nama, e);
    }
  }

  document.getElementById("hasil").innerHTML =
    `Data siap. Total data terbaca: ${semuaData.length}`;
  }

function cariBarang(){
  const input = document.getElementById("kode").value;
  const kode = clean(input);
  const hasil = document.getElementById("hasil");

  if(!input){
    hasil.innerHTML = `<div class="error">Masukkan kode ODDO dulu.</div>`;
    return;
  }

  const ditemukan = semuaData.filter(item =>
    clean(item.oddo).includes(kode)
  );

  if(ditemukan.length === 0){
    hasil.innerHTML = `
      <div class="error">
        Barang tidak ditemukan.<br>
        Total data terbaca: ${semuaData.length}
      </div>
    `;
    return;
  }

  const totalStock = ditemukan.reduce((total,item)=>{
    return total + angka(item.stock);
  },0);

  const pertama = ditemukan[0];

  hasil.innerHTML = `
    <div class="card total">
      <h3>Hasil Pencarian</h3>
      <b>Barcode:</b> ${pertama.barcode}<br>
      <b>Nama:</b> ${pertama.nama}<br>
      <b>Stock Semua KORDINAT:</b> ${totalStock}
    </div>

    <h3 class="section-title">📍 Stock Per Koordinat</h3>
  ` + ditemukan.map(item => `
    <div class="card">
      <b>Koordinat:</b> ${item.koordinat}<br>
      <b>Stock:</b> ${item.stock}<br>
      <b>Batch:</b> ${item.batch}<br>
      <b>Exp Date:</b> ${item.exp}<br>
      <b>Area:</b> ${item.sheet}<br>

<b>Kode Heron:</b>
${item.heron || "-"}
    </div>
  `).join("");
}

loadData();
</script>
</body>
</html>
