<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Barang Odoo</title>

<style>
body{font-family:Arial;background:#f2f4f7;padding:20px}
.box{max-width:900px;margin:auto;background:white;padding:20px;border-radius:16px}
input{width:100%;padding:14px;font-size:18px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;margin-top:10px;padding:14px;border:none;border-radius:10px;background:#111;color:white;font-size:16px}
.card{background:#eef4ff;padding:15px;margin-top:15px;border-radius:12px;line-height:1.8}
.total{background:#dfffe2}
.error{color:red;margin-top:15px}
</style>
</head>

<body>
<div class="box">
<h2>🔎 Cari Barang Odoo</h2>
<input id="kode" placeholder="Masukkan kode ODDO...">
<button onclick="cariBarang()">Cari Barang</button>
<div id="hasil">Mengambil data...</div>
</div>

<script>
const SHEET_ID = "1gcRgVkZLU1zyrsdg7rLrDvhYG7O907QGYKYnY9WW-I0";

const SHEETS = [
  { nama: "KORDINAT PALLET G1", gid: "1990508695" },
  { nama: "KORDINAT PALLET G6", gid: "113664921" },
  { nama: "KORDINAT PALLET G7", gid: "626514614" },
  { nama: "KORDINAT PALLET G8", gid: "876120312" }
];

let semuaData = [];

function clean(teks){
  return String(teks || "")
    .trim()
    .toLowerCase()
    .replace(/\s/g,"")
    .replace(/^0+/,"");
}

function angka(stock){
  return parseFloat(
    String(stock || "0")
      .replace(",",".")
      .replace(/[^0-9.]/g,"")
  ) || 0;
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && insideQuotes && next === '"'){
      value += '"';
      i++;
    } else if(char === '"'){
      insideQuotes = !insideQuotes;
    } else if(char === "," && !insideQuotes){
      row.push(value);
      value = "";
    } else if((char === "\n" || char === "\r") && !insideQuotes){
      if(value || row.length){
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }
      if(char === "\r" && next === "\n") i++;
    } else {
      value += char;
    }
  }

  if(value || row.length){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function ambilSheet(info){
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${info.gid}`;

  const res = await fetch(url);
  const text = await res.text();

  const rows = parseCSV(text);

  let headerIndex = -1;
  let headers = [];

  for(let i = 0; i < rows.length; i++){
    const calon = rows[i].map(h => String(h).trim().toUpperCase());
    if(calon.includes("ODDO")){
      headerIndex = i;
      headers = calon;
      break;
    }
  }

  if(headerIndex === -1){
    console.log("Header ODDO tidak ditemukan:", info.nama);
    return [];
  }

  const idxKoordinat = headers.indexOf("KORDINAT");
  const idxOddo = headers.indexOf("ODDO");
  const idxBarcode = headers.indexOf("BARCODE");
  const idxNama = headers.indexOf("NAMA");
  const idxCode = headers.indexOf("CODE");
  const idxBatch = headers.indexOf("BATCH");
  const idxQty = headers.indexOf("QTY");
  const idxExp = headers.indexOf("EXP DATE");

  return rows.slice(headerIndex + 1).map(r => {
    return {
      sheet: info.nama,
      koordinat: r[idxKoordinat] || "-",
      oddo: r[idxOddo] || "-",
      barcode: r[idxBarcode] || "-",
      nama: r[idxNama] || r[idxCode] || "-",
      batch: r[idxBatch] || "-",
      stock: r[idxQty] || "0",
      exp: r[idxExp] || "-"
    };
  }).filter(item => item.oddo && item.oddo !== "-");
}

async function loadData(){
  semuaData = [];

  for(const sheet of SHEETS){
    try{
      const data = await ambilSheet(sheet);
      semuaData.push(...data);
    }catch(e){
      console.log("Gagal membaca:", sheet.nama, e);
    }
  }

  document.getElementById("hasil").innerHTML =
    `Data siap. Total data terbaca: ${semuaData.length}`;
}

function cariBarang(){
  const input = document.getElementById("kode").value;
  const kode = clean(input);
  const hasil = document.getElementById("hasil");

  if(!input){
    hasil.innerHTML = `<div class="error">Masukkan kode ODDO dulu.</div>`;
    return;
  }

  const ditemukan = semuaData.filter(item =>
    clean(item.oddo).includes(kode)
  );

  if(ditemukan.length === 0){
    hasil.innerHTML = `
      <div class="error">
        Barang tidak ditemukan.<br>
        Total data terbaca: ${semuaData.length}
      </div>
    `;
    return;
  }

  const totalStock = ditemukan.reduce((total,item)=>{
    return total + angka(item.stock);
  },0);

  const pertama = ditemukan[0];

  hasil.innerHTML = `
    <div class="card total">
      <h3>Hasil Pencarian</h3>
      <b>Barcode:</b> ${pertama.barcode}<br>
      <b>Nama:</b> ${pertama.nama}<br>
      <b>Stock Semua KORDINAT:</b> ${totalStock}
    </div>

    <h3>Stock Masing-Masing Area Koordinat</h3>
  ` + ditemukan.map(item => `
    <div class="card">
      <b>Koordinat:</b> ${item.koordinat}<br>
      <b>Stock:</b> ${item.stock}<br>
      <b>Batch:</b> ${item.batch}<br>
      <b>Exp Date:</b> ${item.exp}<br>
      <b>Area:</b> ${item.sheet}
    </div>
  `).join("");
}

loadData();
</script>
</body>
</html>
