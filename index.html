<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OddoSearch</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --text:#0b1b3f;
  --muted:#64748b;
  --blue:#2563eb;
  --soft-blue:#eff6ff;
  --line:#dbeafe;
  --card:#ffffff;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%, rgba(59,130,246,.18), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(34,211,238,.16), transparent 26%),
    linear-gradient(135deg,#eaf4ff,#f4fff5);
  padding:26px 14px;
  color:var(--text);
}

body.dark{
  --text:#e5e7eb;
  --muted:#94a3b8;
  --card:#0f172a;
  --soft-blue:#1e293b;
  --line:#334155;
  background:
    radial-gradient(circle at 10% 0%, rgba(37,99,235,.28), transparent 30%),
    radial-gradient(circle at 90% 10%, rgba(20,184,166,.22), transparent 28%),
    linear-gradient(135deg,#020617,#0f172a);
}

.app{
  width:100%;
  max-width:430px;
  margin:auto;
}

.shell{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.75);
  border-radius:30px;
  padding:12px;
  box-shadow:
    0 25px 70px rgba(15,23,42,.13),
    inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(20px);
}

body.dark .shell{
  background:rgba(15,23,42,.88);
  border-color:rgba(148,163,184,.2);
}

/* HERO */
.hero{
  display:grid;
  grid-template-columns:1fr 118px;
  gap:10px;
  align-items:center;
  min-height:128px;
  padding:18px 18px;
  border-radius:27px;
  background:
    radial-gradient(circle at 100% 0%, rgba(56,189,248,.22), transparent 36%),
    linear-gradient(135deg,#ffffff,#eef8ff);
  border:1px solid #dbeafe;
  box-shadow:0 12px 28px rgba(59,130,246,.08);
  overflow:hidden;
}

body.dark .hero{
  background:
    radial-gradient(circle at 100% 0%, rgba(56,189,248,.15), transparent 36%),
    linear-gradient(135deg,#0f172a,#172554);
}

.brand{
  display:flex;
  gap:13px;
  align-items:center;
  min-width:0;
}

.logo-image{
  width:62px;
  height:62px;
  object-fit:contain;
  border-radius:18px;
  flex-shrink:0;
}

.brand h1{
  margin:0;
  font-size:28px;
  letter-spacing:-1px;
  color:#08245f;
  line-height:1;
}

body.dark .brand h1{
  color:#e0f2fe;
}

.sub{
  margin:9px 0 0;
  font-size:14px;
  line-height:1.4;
  color:#64748b;
}

body.dark .sub{
  color:#cbd5e1;
}

/* FAKE 3D ILLUSTRATION */
.hero-art{
  position:relative;
  width:118px;
  height:100px;
}

.dots{
  position:absolute;
  right:0;
  top:4px;
  width:60px;
  height:60px;
  background-image:radial-gradient(rgba(37,99,235,.22) 2px, transparent 2px);
  background-size:10px 10px;
}

.cube{
  position:absolute;
  right:30px;
  bottom:12px;
  width:74px;
  height:62px;
  border-radius:18px;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.8), transparent 22%),
    linear-gradient(135deg,#93c5fd,#2563eb,#7c3aed);
  box-shadow:0 18px 34px rgba(37,99,235,.24);
  transform:rotate(-5deg);
}

.cube::after{
  content:"";
  position:absolute;
  width:26px;
  height:18px;
  border-radius:5px;
  left:25px;
  bottom:14px;
  background:rgba(255,255,255,.72);
  box-shadow:inset 0 -5px 0 rgba(37,99,235,.12);
}

.lens{
  position:absolute;
  right:6px;
  top:12px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:8px solid #0ea5e9;
  background:rgba(255,255,255,.22);
  box-shadow:0 14px 28px rgba(14,165,233,.26);
}

.lens::after{
  content:"";
  position:absolute;
  width:13px;
  height:42px;
  border-radius:999px;
  right:-18px;
  bottom:-28px;
  background:linear-gradient(180deg,#38bdf8,#2563eb);
  transform:rotate(-42deg);
}

/* SEARCH */
.search-card{
  margin-top:12px;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border-radius:25px;
  background:rgba(255,255,255,.96);
  border:1px solid #e2e8f0;
  box-shadow:0 13px 30px rgba(15,23,42,.08);
}

body.dark .search-card{
  background:rgba(15,23,42,.95);
  border-color:#334155;
}

.search-icon{
  width:50px;
  height:50px;
  min-width:50px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  color:white;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
}

input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:12px 0;
}

input::placeholder{
  color:#94a3b8;
}

/* ACTION GRID */
.actions{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-btn{
  height:86px;
  border:none;
  border-radius:23px;
  padding:12px;
  color:white;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  text-align:left;
  box-shadow:0 16px 32px rgba(37,99,235,.18);
}

.action-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 18% 15%, rgba(255,255,255,.32), transparent 26%),
    linear-gradient(120deg, transparent, rgba(255,255,255,.12), transparent);
}

.action-btn::after{
  content:"›";
  margin-left:auto;
  font-size:34px;
  opacity:.62;
  z-index:2;
}

.action-btn:active{
  transform:scale(.98);
}

.btn-icon{
  width:50px;
  height:50px;
  min-width:50px;
  border-radius:20px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  z-index:2;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}

.btn-copy{
  z-index:2;
  min-width:0;
}

.btn-title{
  display:block;
  font-size:18px;
  font-weight:900;
  line-height:1.05;
  white-space:nowrap;
}

.btn-sub{
  display:block;
  margin-top:5px;
  font-size:12px;
  opacity:.86;
  font-weight:700;
  white-space:nowrap;
}

.btn-dark{
  background:linear-gradient(135deg,#020617,#312e81,#2563eb);
}

.btn-light{
  background:linear-gradient(135deg,#f59e0b,#fb923c,#2563eb);
}

.btn-reset{
  background:linear-gradient(135deg,#0891b2,#0f766e,#0284c7);
}

.btn-search{
  background:linear-gradient(135deg,#3b82f6,#1d4ed8,#2563eb);
}

.btn-scan{
  background:linear-gradient(135deg,#059669,#0d9488,#2563eb);
}

/* PANELS */
.panel{
  margin-top:14px;
  padding:16px;
  border-radius:23px;
  background:rgba(255,255,255,.88);
  border:1px solid #e2e8f0;
  box-shadow:0 12px 26px rgba(15,23,42,.06);
  animation:muncul .28s ease;
}

body.dark .panel{
  background:rgba(15,23,42,.88);
  border-color:#334155;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:13px;
}

.panel-title{
  font-size:15px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:8px;
}

.see-all{
  color:#2563eb;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
}

.chips{
  display:flex;
  gap:9px;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding-bottom:2px;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  border:none;
  padding:9px 13px;
  border-radius:999px;
  background:linear-gradient(135deg,#f8fafc,#eef4ff);
  color:#1e3a8a;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(37,99,235,.08);
}

body.dark .chip{
  background:linear-gradient(135deg,#1e293b,#0f172a);
  color:#bfdbfe;
}

/* STATUS */
.status-card{
  min-height:104px;
  display:grid;
  grid-template-columns:66px 1fr;
  align-items:center;
  gap:15px;
  background:
    radial-gradient(circle at 88% 50%, rgba(16,185,129,.20), transparent 30%),
    linear-gradient(135deg,#ecfdf5,#f0fdf4);
  border:1px solid #a7f3d0;
}

body.dark .status-card{
  background:
    radial-gradient(circle at 88% 50%, rgba(16,185,129,.16), transparent 30%),
    linear-gradient(135deg,#052e16,#064e3b);
  border-color:rgba(16,185,129,.35);
}

.status-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:32px;
  font-weight:900;
  background:linear-gradient(135deg,#4ade80,#16a34a);
  box-shadow:0 14px 24px rgba(34,197,94,.26);
}

.status-title{
  font-size:20px;
  font-weight:900;
  color:#065f46;
}

.status-sub{
  margin-top:5px;
  color:#0f766e;
  font-size:15px;
}

.status-sub b{
  color:#059669;
}

body.dark .status-title{
  color:#d1fae5;
}

body.dark .status-sub{
  color:#a7f3d0;
}

/* RESULT */
.result-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}

.result-title{
  font-size:17px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:8px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.summary-card{
  display:grid;
  grid-template-columns:66px 1fr;
  gap:14px;
  padding:14px;
  border-radius:22px;
  background:linear-gradient(135deg,#f8fbff,#eff6ff);
  border:1px solid rgba(59,130,246,.2);
}

body.dark .summary-card{
  background:linear-gradient(135deg,#0f172a,#1e293b);
}

.box-icon{
  width:58px;
  height:58px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  background:linear-gradient(135deg,#dbeafe,#ffffff);
}

body.dark .box-icon{
  background:linear-gradient(135deg,#1e3a8a,#0f172a);
}

.summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.info-label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:3px;
}

.info-value{
  font-size:14px;
  font-weight:900;
  color:var(--text);
  word-break:break-word;
}

.info-value.blue{
  color:#2563eb;
}

.coord-list{
  margin-top:13px;
  display:grid;
  gap:10px;
}

.coord-card{
  display:grid;
  grid-template-columns:42px 1fr;
  gap:10px;
  padding:12px;
  border-radius:20px;
  background:rgba(255,255,255,.85);
  border:1px solid #e2e8f0;
}

body.dark .coord-card{
  background:rgba(15,23,42,.85);
  border-color:#334155;
}

.coord-number{
  width:38px;
  height:38px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:#2563eb;
  background:#eff6ff;
}

body.dark .coord-number{
  background:#1e3a8a;
  color:#bfdbfe;
}

.coord-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
  padding:16px;
  margin-top:14px;
  border-radius:22px;
  font-weight:bold;
  line-height:1.7;
}

body.dark .error{
  background:#450a0a;
  color:#fecaca;
}

.loading{
  display:flex;
  align-items:center;
  gap:14px;
}

.spinner{
  width:30px;
  height:30px;
  border:4px solid #dbeafe;
  border-top:4px solid #2563eb;
  border-radius:50%;
  animation:putar .8s linear infinite;
}

.footer{
  text-align:center;
  margin:18px 0 0;
  color:#64748b;
  font-size:13px;
}

body.dark .footer{
  color:#94a3b8;
}

@keyframes putar{
  to{transform:rotate(360deg)}
}

@keyframes muncul{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* SCANNER */
.scanner-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:20px;
}

.scanner-video{
  width:100%;
  max-width:430px;
  border-radius:26px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.scanner-frame{
  width:260px;
  height:130px;
  border:3px solid #38bdf8;
  border-radius:18px;
  position:absolute;
  box-shadow:0 0 30px rgba(56,189,248,.5);
  pointer-events:none;
}

.scanner-text{
  color:white;
  margin-top:18px;
  font-size:18px;
  text-align:center;
}

.close-scanner{
  margin-top:18px;
  padding:14px 22px;
  border:none;
  border-radius:16px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:16px;
}

@media(max-width:390px){
  .hero{
    grid-template-columns:1fr;
  }

  .hero-art{
    display:none;
  }

  .brand h1{
    font-size:26px;
  }

  .actions{
    gap:9px;
  }

  .action-btn{
    height:82px;
    padding:10px;
  }

  .btn-icon{
    width:44px;
    height:44px;
    min-width:44px;
    font-size:22px;
  }

  .btn-title{
    font-size:16px;
  }

  .btn-sub{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="app">
  <div class="shell">

    <div class="hero">
      <div class="brand">
        <img src="logo.png" class="logo-image" alt="OddoSearch Logo">
        <div>
          <h1>OddoSearch</h1>
          <p class="sub">Cari barang, stock, batch, koordinat, dan kode Heron</p>
        </div>
      </div>

      <div class="hero-art">
        <div class="dots"></div>
        <div class="cube"></div>
        <div class="lens"></div>
      </div>
    </div>

    <div class="search-card">
      <div class="search-icon">🔍</div>
      <input id="kode" placeholder="Masukkan kode ODDO atau Barcode...">
    </div>

    <div class="actions">
      <button id="themeButton" class="action-btn btn-dark" onclick="toggleDark()">
        <span id="themeIcon" class="btn-icon">🌙</span>
        <span class="btn-copy">
          <span id="themeTitle" class="btn-title">Dark Mode</span>
          <span id="themeSub" class="btn-sub">Ubah tema</span>
        </span>
      </button>

      <button class="action-btn btn-reset" onclick="resetCari()">
        <span class="btn-icon">↻</span>
        <span class="btn-copy">
          <span class="btn-title">Reset</span>
          <span class="btn-sub">Bersihkan hasil</span>
        </span>
      </button>

      <button class="action-btn btn-search" onclick="cariBarang()">
        <span class="btn-icon">🔍</span>
        <span class="btn-copy">
          <span class="btn-title">Cari</span>
          <span class="btn-sub">Temukan barang</span>
        </span>
      </button>

      <button class="action-btn btn-scan" onclick="scanBarcode()">
        <span class="btn-icon">📷</span>
        <span class="btn-copy">
          <span class="btn-title">Scan</span>
          <span class="btn-sub">Pakai kamera</span>
        </span>
      </button>
    </div>

    <div id="history" class="panel" style="display:none;"></div>

    <div id="hasil">
      <div class="panel loading">
        <div class="spinner"></div>
        <div>
          <b>Mengambil data...</b><br>
          OddoSearch sedang membaca sheet.
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    🛡️ OddoSearch © 2026 • Built for #JuaraVibeCoding 🚀
  </div>
</div>

<script>
let semuaData = [];
let riwayat = [];

const SHEET_ID = "1gcRgVkZLU1zyrsdg7rLrDvhYG7O907QGYKYnY9WW-I0";

const SHEETS = [
  { nama: "KORDINAT PALLET G1", gid: "1990508695" },
  { nama: "KORDINAT PALLET G6", gid: "113664921" },
  { nama: "KORDINAT PALLET G7", gid: "626514614" },
  { nama: "KORDINAT PALLET G8", gid: "876120312" }
];

function clean(teks){
  return String(teks || "")
    .trim()
    .toLowerCase()
    .replace(/\s/g,"")
    .replace(/^0+/,"");
}

function angka(stock){
  return parseFloat(
    String(stock || "0")
      .replace(",",".")
      .replace(/[^0-9.]/g,"")
  ) || 0;
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && insideQuotes && next === '"'){
      value += '"';
      i++;
    } else if(char === '"'){
      insideQuotes = !insideQuotes;
    } else if(char === "," && !insideQuotes){
      row.push(value);
      value = "";
    } else if((char === "\n" || char === "\r") && !insideQuotes){
      if(value || row.length){
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }

      if(char === "\r" && next === "\n"){
        i++;
      }
    } else {
      value += char;
    }
  }

  if(value || row.length){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function ambilSheet(info){
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${info.gid}`;

  const res = await fetch(url);
  const text = await res.text();

  const rows = parseCSV(text);

  let headerIndex = -1;
  let headers = [];

  for(let i = 0; i < rows.length; i++){
    const calon = rows[i].map(h => String(h).trim().toUpperCase());

    if(calon.includes("ODDO")){
      headerIndex = i;
      headers = calon;
      break;
    }
  }

  if(headerIndex === -1){
    console.log("Header ODDO tidak ditemukan:", info.nama);
    return [];
  }

  const idxKoordinat = 7;
  const idxOddo = headers.indexOf("ODDO");
  const idxBarcode = headers.indexOf("BARCODE");
  const idxNama = headers.indexOf("NAMA");
  const idxCode = headers.indexOf("CODE");
  const idxBatch = headers.indexOf("BATCH");
  const idxQty = 20;
  const idxExp = headers.indexOf("EXP DATE");
  const idxHeron = 9;

  return rows.slice(headerIndex + 1).map(r => {
    return {
      sheet: info.nama,
      koordinat: r[idxKoordinat] || "-",
      oddo: r[idxOddo] || "-",
      barcode: r[idxBarcode] || "-",
      nama: r[idxNama] || r[idxHeron] || r[idxCode] || "-",
      heron: r[idxHeron] || "-",
      batch: r[idxBatch] || "-",
      stock: r[idxQty] || "0",
      exp: r[idxExp] || "-"
    };
  }).filter(item => item.oddo && item.oddo !== "-");
}

async function loadData(){
  semuaData = [];
  const hasil = document.getElementById("hasil");

  hasil.innerHTML = `
    <div class="panel loading">
      <div class="spinner"></div>
      <div>
        <b>Mengambil data...</b><br>
        Membaca semua sheet koordinat.
      </div>
    </div>
  `;

  for(const sheet of SHEETS){
    try{
      const data = await ambilSheet(sheet);
      semuaData.push(...data);
      console.log(`Berhasil baca ${sheet.nama}:`, data.length);
    }catch(e){
      console.log("Gagal membaca:", sheet.nama, e);
    }
  }

  if(semuaData.length === 0){
    hasil.innerHTML = `
      <div class="error">
        Data gagal dimuat atau total data 0.<br><br>
        Cek:<br>
        1. Spreadsheet harus public/viewer<br>
        2. Internet stabil<br>
        3. GID sheet benar<br>
        4. Header ODDO terbaca
      </div>
    `;
    return;
  }

  hasil.innerHTML = `
    <div class="panel status-card">
      <div class="status-icon">✓</div>
      <div>
        <div class="status-title">Data siap digunakan</div>
        <div class="status-sub">Total data terbaca: <b>${semuaData.length}</b></div>
      </div>
    </div>
  `;
}

function cariBarang(){
  if(semuaData.length === 0){
    alert("Data masih dimuat atau gagal dibaca.");
    return;
  }

  const input = document.getElementById("kode").value;
  const kode = clean(input);
  const hasil = document.getElementById("hasil");

  if(!input){
    hasil.innerHTML = `<div class="error">Masukkan kode ODDO atau Barcode dulu.</div>`;
    return;
  }

  hasil.innerHTML = `
    <div class="panel loading">
      <div class="spinner"></div>
      <div>
        <b>Mencari barang...</b><br>
        Memproses data warehouse.
      </div>
    </div>
  `;

  setTimeout(() => {
    const ditemukan = semuaData.filter(item =>
      clean(item.oddo).includes(kode) ||
      clean(item.barcode).includes(kode)
    );

    if(ditemukan.length === 0){
      hasil.innerHTML = `
        <div class="error">
          Barang tidak ditemukan.<br>
          Coba cek kode ODDO atau Barcode.<br><br>
          Total data terbaca: ${semuaData.length}
        </div>
      `;
      return;
    }

    simpanRiwayat(input);

    const totalStock = ditemukan.reduce((total,item)=>{
      return total + angka(item.stock);
    },0);

    const pertama = ditemukan[0];

    hasil.innerHTML = `
      <div class="panel">
        <div class="result-head">
          <div class="result-title">📄 Hasil pencarian</div>
          <span class="badge">${ditemukan.length} lokasi ditemukan</span>
        </div>

        <div class="summary-card">
          <div class="box-icon">📦</div>

          <div class="summary-grid">
            <div>
              <div class="info-label">ODDO</div>
              <div class="info-value blue">${pertama.oddo}</div>
            </div>

            <div>
              <div class="info-label">Barcode</div>
              <div class="info-value">${pertama.barcode}</div>
            </div>

            <div>
              <div class="info-label">Nama</div>
              <div class="info-value">${pertama.nama}</div>
            </div>

            <div>
              <div class="info-label">Total Stock</div>
              <div class="info-value blue">${totalStock} PCS</div>
            </div>

            <div>
              <div class="info-label">Batch Awal</div>
              <div class="info-value">${pertama.batch}</div>
            </div>

            <div>
              <div class="info-label">Area Awal</div>
              <div class="info-value blue">${pertama.sheet}</div>
            </div>
          </div>
        </div>

        <div class="coord-list">
          ${ditemukan.map((item,index) => `
            <div class="coord-card">
              <div class="coord-number">${String(index + 1).padStart(2,"0")}</div>

              <div class="coord-info">
                <div>
                  <div class="info-label">Koordinat</div>
                  <div class="info-value">${item.koordinat}</div>
                </div>

                <div>
                  <div class="info-label">Stock</div>
                  <div class="info-value blue">${item.stock}</div>
                </div>

                <div>
                  <div class="info-label">Batch</div>
                  <div class="info-value">${item.batch}</div>
                </div>

                <div>
                  <div class="info-label">Exp Date</div>
                  <div class="info-value">${item.exp}</div>
                </div>

                <div>
                  <div class="info-label">Area</div>
                  <div class="info-value">${item.sheet}</div>
                </div>

                <div>
                  <div class="info-label">Kode Heron</div>
                  <div class="info-value">${item.heron || "-"}</div>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }, 300);
}

function resetCari(){
  document.getElementById("kode").value = "";

  document.getElementById("hasil").innerHTML = `
    <div class="panel status-card">
      <div class="status-icon">✓</div>
      <div>
        <div class="status-title">Data siap digunakan</div>
        <div class="status-sub">Total data terbaca: <b>${semuaData.length}</b></div>
      </div>
    </div>
  `;
}

function toggleDark(){
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");

  localStorage.setItem("oddoTheme", isDark ? "dark" : "light");

  updateThemeButton();
}

function updateThemeButton(){
  const isDark = document.body.classList.contains("dark");

  const themeButton = document.getElementById("themeButton");
  const themeIcon = document.getElementById("themeIcon");
  const themeTitle = document.getElementById("themeTitle");
  const themeSub = document.getElementById("themeSub");

  if(isDark){
    themeButton.classList.remove("btn-dark");
    themeButton.classList.add("btn-light");
    themeIcon.textContent = "☀️";
    themeTitle.textContent = "Light Mode";
    themeSub.textContent = "Ubah tema";
  }else{
    themeButton.classList.remove("btn-light");
    themeButton.classList.add("btn-dark");
    themeIcon.textContent = "🌙";
    themeTitle.textContent = "Dark Mode";
    themeSub.textContent = "Ubah tema";
  }
}

function loadTheme(){
  const savedTheme = localStorage.getItem("oddoTheme");

  if(savedTheme === "dark"){
    document.body.classList.add("dark");
  }

  updateThemeButton();
}

function simpanRiwayat(kode){
  if(!riwayat.includes(kode)){
    riwayat.unshift(kode);
  }

  riwayat = riwayat.slice(0,5);
  tampilRiwayat();
}

function tampilRiwayat(){
  const history = document.getElementById("history");

  if(riwayat.length === 0){
    history.style.display = "none";
    history.innerHTML = "";
    return;
  }

  history.style.display = "block";

  history.innerHTML = `
    <div class="panel-head">
      <div class="panel-title">🕘 Riwayat pencarian</div>
      <div class="see-all">Lihat semua ›</div>
    </div>

    <div class="chips">
      ${riwayat.map(k => `
        <button class="chip" onclick="pakaiRiwayat('${k}')">◷ ${k}</button>
      `).join("")}
    </div>
  `;
}

function pakaiRiwayat(kode){
  document.getElementById("kode").value = kode;
  cariBarang();
}

async function scanBarcode(){

  if(!("BarcodeDetector" in window)){
    alert("Browser belum support scan barcode. Coba buka lewat Google Chrome Android.");
    return;
  }

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      }
    });

    const detector = new BarcodeDetector({
      formats: [
        "ean_13",
        "ean_8",
        "code_128",
        "code_39",
        "qr_code",
        "upc_a",
        "upc_e"
      ]
    });

    const scanBox = document.createElement("div");

    scanBox.innerHTML = `
      <div class="scanner-overlay">
        <video id="scannerVideo" class="scanner-video" autoplay playsinline></video>
        <div class="scanner-frame"></div>
        <p class="scanner-text">📷 Arahkan kamera ke barcode barang</p>
        <button id="tutupScanner" class="close-scanner">Tutup Scanner</button>
      </div>
    `;

    document.body.appendChild(scanBox);

    const videoElement = scanBox.querySelector("#scannerVideo");
    videoElement.srcObject = stream;

    document.getElementById("tutupScanner").onclick = () => {
      stream.getTracks().forEach(track => track.stop());
      scanBox.remove();
    };

    async function scanLoop(){
      try{
        const barcodes = await detector.detect(videoElement);

        if(barcodes.length > 0){
          const kodeBarcode = barcodes[0].rawValue;

          document.getElementById("kode").value = kodeBarcode;

          stream.getTracks().forEach(track => track.stop());
          scanBox.remove();

          cariBarang();
          return;
        }
      }catch(err){
        console.log("Scan error:", err);
      }

      requestAnimationFrame(scanLoop);
    }

    scanLoop();

  }catch(err){
    console.log(err);
    alert("Kamera tidak bisa dibuka. Izinkan akses kamera dulu.");
  }
}

document.getElementById("kode").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    cariBarang();
  }
});

loadTheme();
loadData();
</script>
