<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OddoSearch</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e8f3ff,#f7fff0);
  padding:22px;
  color:#172033;
}

body.dark{
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#e5e7eb;
}

.box{
  max-width:920px;
  margin:auto;
  background:rgba(255,255,255,.92);
  padding:22px;
  border-radius:24px;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

body.dark .box{
  background:rgba(15,23,42,.95);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.logo-image{
  width:72px;
  height:72px;
  object-fit:contain;
  border-radius:18px;
}

h1{
  margin:0;
  font-size:30px;
}

.sub{
  margin:3px 0 0;
  color:#6b7280;
  font-size:14px;
}

body.dark .sub{
  color:#94a3b8;
}

.top-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.search-box{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-top:18px;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input{
  flex:1;
  padding:16px;
  font-size:18px;
  border-radius:16px;
  border:1px solid #d1d5db;
  outline:none;
  background:#f9fafb;
}

body.dark input{
  background:#0f172a;
  color:#e5e7eb;
  border-color:#334155;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

button{
  border:none;
  cursor:pointer;
  font-weight:800;
  letter-spacing:.2px;
  position:relative;
  overflow:hidden;
  transition:.22s ease;
}

button::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:80%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.35),
    transparent
  );
  transition:.45s ease;
}

button:hover::before{
  left:120%;
}

button:active{
  transform:scale(.97);
}

.btn-main,
.btn-small{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border-radius:18px;
  color:white;
  box-shadow:
    0 12px 24px rgba(37,99,235,.25),
    inset 0 1px 0 rgba(255,255,255,.18);
}

.btn-main{
  padding:17px 20px;
  font-size:17px;
  background:
    radial-gradient(circle at top left, rgba(96,165,250,.9), transparent 35%),
    linear-gradient(135deg,#020617,#1d4ed8,#2563eb);
}

.btn-small{
  padding:14px 16px;
  font-size:14px;
}

.btn-dark{
  background:
    radial-gradient(circle at top left, rgba(168,85,247,.75), transparent 38%),
    linear-gradient(135deg,#020617,#312e81,#2563eb);
}

.btn-light{
  background:
    radial-gradient(circle at top left, rgba(253,224,71,.9), transparent 38%),
    linear-gradient(135deg,#f59e0b,#f97316,#2563eb);
}

.btn-reset{
  background:
    radial-gradient(circle at top left, rgba(251,191,36,.75), transparent 38%),
    linear-gradient(135deg,#1f2937,#334155,#475569);
}

.btn-scan{
  background:
    radial-gradient(circle at top left, rgba(34,211,238,.8), transparent 38%),
    linear-gradient(135deg,#022c22,#0f766e,#2563eb);
}

.btn-icon{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:12px;
  background:rgba(255,255,255,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}

.btn-text{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  line-height:1.1;
}

.btn-title{
  font-size:15px;
}

.btn-sub{
  font-size:11px;
  font-weight:600;
  opacity:.8;
  margin-top:3px;
}

.card{
  background:#eef4ff;
  padding:18px;
  margin-top:16px;
  border-radius:20px;
  line-height:1.8;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
  animation:muncul .3s ease;
}

body.dark .card{
  background:#1e293b;
  color:#e5e7eb;
}

.total{
  background:linear-gradient(135deg,#dcfce7,#bbf7d0);
  border:1px solid #86efac;
  color:#14532d;
}

body.dark .total{
  background:linear-gradient(135deg,#064e3b,#065f46);
  border:1px solid #10b981;
  color:#d1fae5;
}

.error{
  background:#fee2e2;
  color:#dc2626;
  padding:18px;
  margin-top:16px;
  border-radius:18px;
  font-weight:bold;
}

body.dark .error{
  background:#450a0a;
  color:#fecaca;
}

.section-title{
  margin-top:24px;
  font-size:22px;
}

.loading{
  display:flex;
  align-items:center;
  gap:12px;
}

.spinner{
  width:26px;
  height:26px;
  border:4px solid #dbeafe;
  border-top:4px solid #2563eb;
  border-radius:50%;
  animation:putar .8s linear infinite;
}

@keyframes putar{
  to{
    transform:rotate(360deg);
  }
}

@keyframes muncul{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.success{
  background:linear-gradient(135deg,#dcfce7,#f0fdf4);
  border:1px solid #86efac;
  color:#14532d;
}

body.dark .success{
  background:linear-gradient(135deg,#052e16,#064e3b);
  border:1px solid #10b981;
  color:#d1fae5;
}

.history button{
  margin:4px;
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  background:linear-gradient(135deg,#020617,#2563eb);
  color:white;
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:13px;
  font-weight:bold;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#64748b;
  font-size:14px;
}

@media(max-width:600px){
  .top-actions{
    grid-template-columns:1fr;
  }

  .action-row{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    <img src="logo.png" class="logo-image" alt="OddoSearch Logo">
    <div>
      <h1>OddoSearch</h1>
      <p class="sub">Cari barang, stock, batch, koordinat, dan kode Heron</p>
    </div>
  </div>

  <div class="top-actions">
    <button id="themeButton" class="btn-small btn-dark" onclick="toggleDark()">
      <span id="themeIcon" class="btn-icon">🌙</span>
      <span class="btn-text">
        <span id="themeTitle" class="btn-title">Dark Mode</span>
        <span id="themeSub" class="btn-sub">ubah tema gelap</span>
      </span>
    </button>

    <button class="btn-small btn-reset" onclick="resetCari()">
      <span class="btn-icon">↩️</span>
      <span class="btn-text">
        <span class="btn-title">Reset</span>
        <span class="btn-sub">bersihkan hasil</span>
      </span>
    </button>
  </div>

  <div class="search-box">
    <input id="kode" placeholder="Masukkan kode ODDO atau Barcode...">

    <div class="action-row">
      <button class="btn-main" onclick="cariBarang()">
        <span class="btn-icon">🔎</span>
        <span class="btn-text">
          <span class="btn-title">Cari</span>
          <span class="btn-sub">temukan barang</span>
        </span>
      </button>

      <button class="btn-main btn-scan" onclick="scanBarcode()">
        <span class="btn-icon">📷</span>
        <span class="btn-text">
          <span class="btn-title">Scan</span>
          <span class="btn-sub">pakai kamera</span>
        </span>
      </button>
    </div>
  </div>

  <div id="history" class="history"></div>

  <div id="hasil">
    <div class="card loading">
      <div class="spinner"></div>
      <div>
        <b>Mengambil data...</b><br>
        OddoSearch sedang membaca sheet.
      </div>
    </div>
  </div>

</div>

<div class="footer">
  OddoSearch © 2026 • Built for #JuaraVibeCoding 🚀
</div>

<script>
let semuaData = [];
let riwayat = [];

const SHEET_ID = "1gcRgVkZLU1zyrsdg7rLrDvhYG7O907QGYKYnY9WW-I0";

const SHEETS = [
  { nama: "KORDINAT PALLET G1", gid: "1990508695" },
  { nama: "KORDINAT PALLET G6", gid: "113664921" },
  { nama: "KORDINAT PALLET G7", gid: "626514614" },
  { nama: "KORDINAT PALLET G8", gid: "876120312" }
];

function clean(teks){
  return String(teks || "")
    .trim()
    .toLowerCase()
    .replace(/\s/g,"")
    .replace(/^0+/,"");
}

function angka(stock){
  return parseFloat(
    String(stock || "0")
      .replace(",",".")
      .replace(/[^0-9.]/g,"")
  ) || 0;
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && insideQuotes && next === '"'){
      value += '"';
      i++;
    } else if(char === '"'){
      insideQuotes = !insideQuotes;
    } else if(char === "," && !insideQuotes){
      row.push(value);
      value = "";
    } else if((char === "\n" || char === "\r") && !insideQuotes){
      if(value || row.length){
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }

      if(char === "\r" && next === "\n"){
        i++;
      }
    } else {
      value += char;
    }
  }

  if(value || row.length){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function ambilSheet(info){
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${info.gid}`;

  const res = await fetch(url);
  const text = await res.text();

  const rows = parseCSV(text);

  let headerIndex = -1;
  let headers = [];

  for(let i = 0; i < rows.length; i++){
    const calon = rows[i].map(h => String(h).trim().toUpperCase());

    if(calon.includes("ODDO")){
      headerIndex = i;
      headers = calon;
      break;
    }
  }

  if(headerIndex === -1){
    console.log("Header ODDO tidak ditemukan:", info.nama);
    return [];
  }

  const idxKoordinat = 7;
  const idxOddo = headers.indexOf("ODDO");
  const idxBarcode = headers.indexOf("BARCODE");
  const idxNama = headers.indexOf("NAMA");
  const idxCode = headers.indexOf("CODE");
  const idxBatch = headers.indexOf("BATCH");
  const idxQty = 20;
  const idxExp = headers.indexOf("EXP DATE");
  const idxHeron = 9;

  return rows.slice(headerIndex + 1).map(r => {
    return {
      sheet: info.nama,
      koordinat: r[idxKoordinat] || "-",
      oddo: r[idxOddo] || "-",
      barcode: r[idxBarcode] || "-",
      nama: r[idxNama] || r[idxHeron] || r[idxCode] || "-",
      heron: r[idxHeron] || "-",
      batch: r[idxBatch] || "-",
      stock: r[idxQty] || "0",
      exp: r[idxExp] || "-"
    };
  }).filter(item => item.oddo && item.oddo !== "-");
}

async function loadData(){
  semuaData = [];
  const hasil = document.getElementById("hasil");

  hasil.innerHTML = `
    <div class="card loading">
      <div class="spinner"></div>
      <div>
        <b>Mengambil data...</b><br>
        Membaca semua sheet koordinat.
      </div>
    </div>
  `;

  for(const sheet of SHEETS){
    try{
      const data = await ambilSheet(sheet);
      semuaData.push(...data);
      console.log(`Berhasil baca ${sheet.nama}:`, data.length);
    }catch(e){
      console.log("Gagal membaca:", sheet.nama, e);
    }
  }

  if(semuaData.length === 0){
    hasil.innerHTML = `
      <div class="error">
        Data gagal dimuat atau total data 0.<br><br>
        Cek:<br>
        1. Spreadsheet harus public/viewer<br>
        2. Internet stabil<br>
        3. GID sheet benar<br>
        4. Header ODDO terbaca
      </div>
    `;
    return;
  }

  hasil.innerHTML = `
    <div class="card success">
      ✅ Data siap digunakan.<br>
      <b>Total data terbaca:</b> ${semuaData.length}
    </div>
  `;
}

function cariBarang(){
  if(semuaData.length === 0){
    alert("Data masih dimuat atau gagal dibaca.");
    return;
  }

  const input = document.getElementById("kode").value;
  const kode = clean(input);
  const hasil = document.getElementById("hasil");

  if(!input){
    hasil.innerHTML = `<div class="error">Masukkan kode ODDO atau Barcode dulu.</div>`;
    return;
  }

  hasil.innerHTML = `
    <div class="card loading">
      <div class="spinner"></div>
      <div>
        <b>Mencari barang...</b><br>
        Memproses data warehouse.
      </div>
    </div>
  `;

  setTimeout(() => {
    const ditemukan = semuaData.filter(item =>
      clean(item.oddo).includes(kode) ||
      clean(item.barcode).includes(kode)
    );

    if(ditemukan.length === 0){
      hasil.innerHTML = `
        <div class="error">
          Barang tidak ditemukan.<br>
          Coba cek kode ODDO atau Barcode.<br><br>
          Total data terbaca: ${semuaData.length}
        </div>
      `;
      return;
    }

    simpanRiwayat(input);

    const totalStock = ditemukan.reduce((total,item)=>{
      return total + angka(item.stock);
    },0);

    const pertama = ditemukan[0];

    hasil.innerHTML = `
      <div class="card total">
        <h3>✅ Hasil Pencarian</h3>
        <span class="badge">${ditemukan.length} lokasi ditemukan</span><br><br>
        <b>ODDO:</b> ${pertama.oddo}<br>
        <b>Barcode:</b> ${pertama.barcode}<br>
        <b>Nama:</b> ${pertama.nama}<br>
        <b>Total Stock:</b> ${totalStock}
      </div>

      <h3 class="section-title">📍 Stock Per Koordinat</h3>
    ` + ditemukan.map(item => `
      <div class="card">
        <b>Koordinat:</b> ${item.koordinat}<br>
        <b>Stock:</b> ${item.stock}<br>
        <b>Batch:</b> ${item.batch}<br>
        <b>Exp Date:</b> ${item.exp}<br>
        <b>Area:</b> ${item.sheet}<br>
        <b>Kode Heron:</b> ${item.heron || "-"}
      </div>
    `).join("");
  }, 300);
}

function resetCari(){
  document.getElementById("kode").value = "";

  document.getElementById("hasil").innerHTML = `
    <div class="card success">
      ✅ Data siap digunakan.<br>
      <b>Total data terbaca:</b> ${semuaData.length}
    </div>
  `;
}

function toggleDark(){
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");

  localStorage.setItem("oddoTheme", isDark ? "dark" : "light");

  updateThemeButton();
}

function updateThemeButton(){
  const isDark = document.body.classList.contains("dark");

  const themeButton = document.getElementById("themeButton");
  const themeIcon = document.getElementById("themeIcon");
  const themeTitle = document.getElementById("themeTitle");
  const themeSub = document.getElementById("themeSub");

  if(isDark){
    themeButton.classList.remove("btn-dark");
    themeButton.classList.add("btn-light");
    themeIcon.textContent = "☀️";
    themeTitle.textContent = "Light Mode";
    themeSub.textContent = "ubah tema terang";
  }else{
    themeButton.classList.remove("btn-light");
    themeButton.classList.add("btn-dark");
    themeIcon.textContent = "🌙";
    themeTitle.textContent = "Dark Mode";
    themeSub.textContent = "ubah tema gelap";
  }
}

function loadTheme(){
  const savedTheme = localStorage.getItem("oddoTheme");

  if(savedTheme === "dark"){
    document.body.classList.add("dark");
  }

  updateThemeButton();
}

function simpanRiwayat(kode){
  if(!riwayat.includes(kode)){
    riwayat.unshift(kode);
  }

  riwayat = riwayat.slice(0,5);
  tampilRiwayat();
}

function tampilRiwayat(){
  const history = document.getElementById("history");

  if(riwayat.length === 0){
    history.innerHTML = "";
    return;
  }

  history.innerHTML = `
    <div class="card">
      <b>🕘 Riwayat pencarian:</b><br>
      ${riwayat.map(k => `
        <button onclick="pakaiRiwayat('${k}')">${k}</button>
      `).join("")}
    </div>
  `;
}

function pakaiRiwayat(kode){
  document.getElementById("kode").value = kode;
  cariBarang();
}

async function scanBarcode(){

  if(!("BarcodeDetector" in window)){
    alert("Browser belum support scan barcode. Coba buka lewat Google Chrome Android.");
    return;
  }

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      }
    });

    const detector = new BarcodeDetector({
      formats: [
        "ean_13",
        "ean_8",
        "code_128",
        "code_39",
        "qr_code",
        "upc_a",
        "upc_e"
      ]
    });

    const scanBox = document.createElement("div");

    scanBox.innerHTML = `
      <div style="
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.96);
        z-index:9999;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        padding:20px;
      ">

        <video id="scannerVideo"
          autoplay
          playsinline
          style="
            width:100%;
            max-width:430px;
            border-radius:22px;
            box-shadow:0 20px 50px rgba(0,0,0,.45);
          ">
        </video>

        <div style="
          width:260px;
          height:130px;
          border:3px solid #38bdf8;
          border-radius:18px;
          position:absolute;
          box-shadow:0 0 30px rgba(56,189,248,.5);
          pointer-events:none;
        "></div>

        <p style="
          color:white;
          margin-top:18px;
          font-size:18px;
          text-align:center;
        ">
          📷 Arahkan kamera ke barcode barang
        </p>

        <button id="tutupScanner" style="
          margin-top:18px;
          padding:14px 22px;
          border:none;
          border-radius:14px;
          background:#2563eb;
          color:white;
          font-weight:bold;
          font-size:16px;
        ">
          Tutup Scanner
        </button>

      </div>
    `;

    document.body.appendChild(scanBox);

    const videoElement = scanBox.querySelector("#scannerVideo");
    videoElement.srcObject = stream;

    document.getElementById("tutupScanner").onclick = () => {
      stream.getTracks().forEach(track => track.stop());
      scanBox.remove();
    };

    async function scanLoop(){
      try{
        const barcodes = await detector.detect(videoElement);

        if(barcodes.length > 0){
          const kodeBarcode = barcodes[0].rawValue;

          document.getElementById("kode").value = kodeBarcode;

          stream.getTracks().forEach(track => track.stop());
          scanBox.remove();

          cariBarang();
          return;
        }
      }catch(err){
        console.log("Scan error:", err);
      }

      requestAnimationFrame(scanLoop);
    }

    scanLoop();

  }catch(err){
    console.log(err);
    alert("Kamera tidak bisa dibuka. Izinkan akses kamera dulu.");
  }
}

document.getElementById("kode").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    cariBarang();
  }
});

loadTheme();
loadData();
</script>

</body>
</html>
